[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "disc-imagenet"
version = "0.1.0"
description = "DISC feature extraction and evaluation"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["disc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

